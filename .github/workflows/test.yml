# Runs the test suites on every push to a branch and on every pull request.
# (Tags are released by release.yml, which runs the tests too.)
#
# Everything runs inside the project's toolchain image, as `make test` does
# locally. It's built once and then reused from GitHub's cache until the
# Dockerfile changes.

name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # The Makefile names the image after the Dockerfile's hash and builds it
      # only if it's missing, so `make test` uses the one built here.
      - name: Name the toolchain image
        id: image
        run: echo "tag=nasbridge-ps5-toolchain:$(sha256sum Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: make test
